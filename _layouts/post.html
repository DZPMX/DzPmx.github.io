---
layout: default
---
<article class="post-page">
  <header class="cover post-cover">
    <div class="container">
      <div class="content-row">
        <div class="cover-column">
          <div class="post-heading">
            <h1>{{ page.title | escape }}</h1>
            <p class="post-byline">Posted by {{ page.author | default: site.author | escape }} on <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="container">
    <div class="content-row">
      <div class="reading-column">
        <div class="post-content">
          {{ content }}
        </div>
        <footer class="post-end">
          <a class="back-link" href="{{ '/' | relative_url }}#articles"><span aria-hidden="true">←</span> All Posts</a>
        </footer>
      </div>
    </div>
  </div>
</article>
