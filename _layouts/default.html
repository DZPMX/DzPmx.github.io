<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% feed_meta %}
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳转到正文</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }}，首页">
          <span class="brand-mark" aria-hidden="true">D.</span>
          <span>{{ site.author | escape }}<span class="brand-caption">个人博客</span></span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}#articles">文章</a>
          <a href="https://github.com/{{ site.github_username | escape }}">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>© {{ site.time | date: '%Y' }} {{ site.author | escape }}<span class="footer-dot" aria-hidden="true"> · </span><span>个人博客</span></p>
        <div class="footer-links">
          <a href="{{ '/feed.xml' | relative_url }}">RSS 订阅 <span aria-hidden="true">↗</span></a>
          <a href="https://github.com/{{ site.github_username | escape }}">GitHub <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </footer>
  </body>
</html>
