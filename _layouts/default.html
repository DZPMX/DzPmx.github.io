<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% feed_meta %}
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳转到正文</a>
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.author | escape }} Blog</a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/' | relative_url }}#articles">文章</a>
          <a href="https://github.com/{{ site.github_username | escape }}">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <nav class="footer-links" aria-label="页脚链接">
        <a href="https://github.com/{{ site.github_username | escape }}">GitHub</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS 订阅</a>
      </nav>
      <p>© {{ site.time | date: '%Y' }} {{ site.author | escape }} Blog</p>
    </footer>
  </body>
</html>
