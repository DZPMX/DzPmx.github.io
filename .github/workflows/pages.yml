name: Publish blog

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install math article converter
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc python3-yaml
      - name: Prepare math articles
        run: python3 scripts/prepare-math.py
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./
          destination: ./_site
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
